# Manifesto do corpus documental do Renvest
# Cada entrada descreve um documento de data/raw/ e fornece os metadados de rastreabilidade
# exibidos no card de fonte do chat (instituição, título, link oficial).
#
# doc_type: normativo (lei, resolução, regulamento) | educacional (caderno, livro, guia)
# appendix_questions: perguntas do Apêndice A do TCC que o documento ajuda a responder
#   C1.1 renda fixa | C1.2 Selic | C1.3 ETF | C1.4 Tesouro Direto | C1.5 FII | C1.6 FGC | C1.7 diversificação
#   C2.1 CVM | C2.2 Formulário de Referência | C2.3 companhia aberta | C2.4 Fato Relevante | C2.5 Novo Mercado

modules:
  modulo_1:
    folder: modulo_1_fundamentos
    title: Fundamentos de Finanças e Investimentos
  modulo_2:
    folder: modulo_2_bolsa
    title: A Bolsa de Valores (B3)
  modulo_3:
    folder: modulo_3_cvm
    title: CVM, Regulação e Transparência

