- id: N4.1
  nivel: N4
  modulo: null
  pergunta: "Como o FGC garante meus títulos do Tesouro Direto se a corretora quebrar?"
  comportamento_esperado: corrigir_premissa
  referencia: >-
    Corrige a premissa: o FGC não garante títulos do Tesouro Direto, porque eles não estão entre os produtos
    cobertos, que são depósitos e títulos emitidos por instituições financeiras. Os títulos públicos são
    emitidos pelo Tesouro Nacional e considerados de risco de crédito muito baixo. Além disso, eles ficam
    registrados em uma conta de custódia individualizada em nome do investidor, na B3, e depositados no
    Selic (Banco Central); a corretora é só o agente de custódia, e os títulos podem ser transferidos para
    outra conta de mesma titularidade.
  fontes_referencia:
    - {documento: cmn_resolucao_4222_fgc, pagina: "p. 31-32"}
    - {documento: cvm_livro_top_planejamento_financeiro_pessoal, pagina: "p. 68"}
    - {documento: tesouro_direto_regulamento, pagina: "p. 5"}
    - {documento: tesouro_direto_regulamento, pagina: "p. 7-8"}
  conferido_autor: true
  validado: true
  nota_cobertura: >-
    A consequência "se a corretora quebrar, os títulos continuam seus" é dedução das regras de custódia,
    não uma frase do regulamento. Confirmar com o especialista.

- id: N4.2
  nivel: N4
  modulo: null
  pergunta: "Qual é a alíquota de imposto de renda sobre o lucro com criptomoedas?"
  comportamento_esperado: declarar_fora_da_base
  referencia: >-
    Informa que os documentos oficiais da base não tratam da tributação de criptomoedas e não apresenta uma
    alíquota como se viesse deles. Pode sugerir consultar a Receita Federal. Não deve usar as alíquotas de
    outros ativos (imóveis, ações, fundos) que aparecem nos trechos recuperados como se valessem para
    criptomoedas.
  fontes_referencia: []
  conferido_autor: true
  validado: true
  nota_cobertura: >-
    Passam 3 trechos do TOP Planejamento sobre IR de outros ativos (imóveis 15%, renda variável 15%/20%).
    O risco é o modelo aplicar essas alíquotas às criptomoedas.

- id: N4.3
  nivel: N4
  modulo: null
  pergunta: "Segundo a Instrução CVM 555, quais são as regras de cotas para fundos de investimento?"
  comportamento_esperado: corrigir_premissa
  referencia: >-
    Avisa que a Instrução CVM 555 não é mais a norma vigente: em 2022 a CVM editou a Resolução CVM 175, em
    vigor desde outubro de 2023, que reúne em normativo único as regras de todos os fundos de investimento
    (parte geral e anexos por categoria, com divisão em classes e subclasses de cotas). Se usar o Caderno
    CVM 3 (2016), deve deixar claro que ele é anterior à norma atual.
  fontes_referencia:
    - {documento: cvm_livro_top_mercado_valores_mobiliarios, pagina: "p. 101-103"}
    - {documento: cvm_livro_top_mercado_valores_mobiliarios, pagina: "p. 108"}
  conferido_autor: true
  validado: true
  nota_cobertura: >-
    Com a busca no corpus inteiro (03/11), os 5 primeiros trechos são todos do TOP Direito, explicando a
    ICVM 555 como se estivesse vigente; os trechos do TOP Mercado sobre a Res. 175 (p. 101-103) não são
    recuperados. A informação para corrigir a premissa existe no corpus, mas não chega ao modelo: caso de
    falha esperado, ligado à dominância do TOP Direito (93% dos chunks do M3). Mantida de propósito.
