- id: N1.1
  nivel: N1
  modulo: null
  pergunta: "O que é renda fixa e quais são os principais produtos dessa categoria no Brasil?"
  comportamento_esperado: responder
  referencia: >-
    Renda fixa são investimentos que pagam, em períodos definidos, uma remuneração correspondente a uma taxa
    de juros, que pode ser fixada no momento da aplicação (prefixada) ou calculada no resgate com base em um
    indexador, como Selic, DI ou IPCA (pós-fixada), ou combinar as duas coisas, como a Nota do Tesouro
    Nacional série B (Tesouro IPCA+), que paga uma taxa prefixada mais a variação da inflação (IPCA). Costumam
    ter menor risco e menor rentabilidade esperada que aplicações mais arriscadas, mas o risco existe. Os
    principais produtos são os títulos públicos (Letra Financeira do Tesouro, Letra do Tesouro Nacional e Nota
    do Tesouro Nacional), a poupança e os títulos privados, como CDB, RDB, Letras de Câmbio, LCI, LCA, CRI,
    CRA e debêntures.
  fontes_referencia:
    - {documento: bcb_caderno_gestao_financas_pessoais, pagina: "p. 65"}
    - {documento: cvm_livro_top_planejamento_financeiro_pessoal, pagina: "p. 85-86"}
    - {documento: cvm_livro_top_planejamento_financeiro_pessoal, pagina: "p. 215-216"}
    - {documento: cvm_livro_top_planejamento_financeiro_pessoal, pagina: "p. 89"}
    - {documento: tesouro_direto_regulamento, pagina: "p. 7"}
  conferido_autor: true
  validado: true
  ajustes: "16/11 (especialistas 1 e 2): incluída a modalidade híbrida, taxa prefixada + IPCA (NTN-B / Tesouro IPCA+; TOP Planejamento, p. 89; Regulamento TD, p. 7)."
  revisao_previa: "Incluídos poupança, CRI e CRA (TOP Planejamento, p. 216)."

- id: N1.2
  nivel: N1
  modulo: null
  pergunta: "O que é a CVM e qual é o seu papel no mercado de capitais brasileiro?"
  comportamento_esperado: responder
  referencia: >-
    A Comissão de Valores Mobiliários (CVM) é uma autarquia federal criada em 1976 pela Lei nº 6.385/76,
    responsável pela regulação e fiscalização do mercado de capitais no Brasil. É uma autarquia em regime
    especial: tem vínculo com o Ministério da Fazenda, mas não é subordinada a ele, e seus dirigentes têm
    mandato fixo. Entre suas funções estão estabelecer normas, fiscalizar seu cumprimento e punir quem as
    descumpre, promover o desenvolvimento e a eficiência do mercado e proteger os investidores contra
    fraudes e práticas irregulares.
  fontes_referencia:
    - {documento: cvm_caderno_01_o_que_e_a_cvm, pagina: "p. 7-8"}
    - {documento: cvm_livro_top_direito_mercado_valores_mobiliarios, pagina: "p. 22-23"}
  conferido_autor: true
  validado: true
  revisao_previa: "Incluído o regime especial e o vínculo sem subordinação ao Ministério da Fazenda (Caderno CVM 1, p. 7)."

- id: N1.3
  nivel: N1
  modulo: null
  pergunta: "O que é o FGC e quais produtos ele cobre?"
  comportamento_esperado: responder
  referencia: >-
    O Fundo Garantidor de Créditos (FGC) é uma associação civil sem fins lucrativos, de direito privado, que
    protege depositantes e investidores quando uma instituição associada sofre intervenção, liquidação
    extrajudicial, falência ou tem a insolvência reconhecida pelo Banco Central. A garantia ordinária cobre,
    entre outros, depósitos à vista, poupança, depósitos a prazo (CDB e RDB), Letras de Câmbio, Letras
    Hipotecárias, LCI, LCA e Letras de Crédito do Desenvolvimento, até R$ 250 mil por CPF ou CNPJ por
    instituição ou conglomerado, com teto de R$ 1 milhão a cada quatro anos somando todas as instituições. Não
    são cobertos, por exemplo, cotas de fundos de investimento, Letras Financeiras, Letras Imobiliárias e
    Letras Imobiliárias Garantidas (LIG).
  fontes_referencia:
    - {documento: cmn_resolucao_4222_fgc, pagina: "p. 9"}
    - {documento: cmn_resolucao_4222_fgc, pagina: "p. 31-32"}
    - {documento: cvm_livro_top_planejamento_financeiro_pessoal, pagina: "p. 103-104"}
    - {documento: cvm_livro_top_planejamento_financeiro_pessoal, pagina: "p. 99"}
    - {documento: cvm_livro_top_planejamento_financeiro_pessoal, pagina: "p. 103"}
    - {documento: cvm_livro_top_planejamento_financeiro_pessoal, pagina: "p. 105"}
  conferido_autor: true
  validado: true
  ajustes: "16/11 (especialista 2): ampliados os exemplos não cobertos com Letras Financeiras, LI e LIG (TOP Planejamento, p. 99, 103 e 105). Recusados títulos públicos, CRI, CRA e debêntures como exemplos explícitos: o corpus não os lista entre os não cobertos."
  revisao_previa: >-
    Incluídos a LCD, o conglomerado, o teto de R$ 1 milhão e um exemplo do que não é coberto (Res. 4.222,
    art. 2º e §§ 1º-3º, p. 31-32). Recusada a inclusão da LIG: ela não está no rol do art. 2º.

- id: N2.1
  nivel: N2
  modulo: null
  pergunta: "Qual é o limite de garantia do FGC por pessoa e por instituição, e existe um teto total para quem tem aplicações em vários bancos?"
  comportamento_esperado: responder
  referencia: >-
    O total de créditos de cada pessoa contra a mesma instituição associada, ou contra todas as instituições
    do mesmo conglomerado financeiro, é garantido até R$ 250 mil. Existe também um teto global: o total
    garantido para cada credor contra o conjunto de todas as instituições associadas é de até R$ 1 milhão a
    cada período de quatro anos consecutivos. O limite vale para o saldo total dos créditos, corrigido pelos
    índices do contrato até a data da intervenção ou liquidação, e não só para o valor aplicado.
  fontes_referencia:
    - {documento: cmn_resolucao_4222_fgc, pagina: "p. 32"}
    - {documento: cmn_resolucao_4222_fgc, pagina: "p. 34"}
    - {documento: cvm_livro_top_planejamento_financeiro_pessoal, pagina: "p. 104"}
    - {documento: cvm_livro_top_planejamento_financeiro_pessoal, pagina: "p. 106"}
  conferido_autor: true
  validado: true
  revisao_previa: >-
    Incluído que o limite abrange o saldo corrigido até a decretação, não só o principal (Res. 4.222, art. 2º,
    §§ 2º e 11, p. 32 e 34).
  nota_cobertura: >-
    O trecho principal (Res. 4.222, p. 32) não aparece no top-5. O top-3 do chat traz um quadro com
    "R$ 20 milhões" (p. 96) e o limite de R$ 40 milhões do DPGE, o que pode confundir o modelo. Bom
    candidato a caso de falha de recuperação.

- id: N2.2
  nivel: N2
  modulo: null
  pergunta: "Em quanto tempo o dinheiro de uma venda antecipada no Tesouro Direto cai na conta, e o horário da venda muda isso?"
  comportamento_esperado: responder
  referencia: >-
    Depende do horário da venda, e os prazos são contados em dias úteis. Vendas feitas entre 9h30 e 13h têm o
    dinheiro repassado no mesmo dia útil, desde que os preços e taxas tenham sido divulgados antes das 13h;
    vendas entre 13h e 18h, em até um dia útil. Vendas agendadas entre 18h01 e 23h59 são pagas no dia útil
    seguinte (ou no segundo, se os preços saírem depois das 13h), e as agendadas entre 0h e 5h, no mesmo dia
    útil (ou no seguinte, nas mesmas condições). Quem repassa o valor líquido (já descontados os impostos) é o
    agente de custódia, isto é, o banco ou a corretora em que o investidor tem conta.
  fontes_referencia:
    - {documento: tesouro_direto_regulamento, pagina: "p. 37-38"}
  conferido_autor: true
  validado: true
  ajustes: "16/11 (especialistas 1 e 2): explicitado que os prazos contam em dias úteis. Recusados o processamento em fins de semana com \"preços de abertura\" (não consta no Regulamento TD) e os impostos (IR regressivo, IOF; especialista 1): fora do corpus citado e fora do escopo da pergunta, que é sobre prazo."
  revisao_previa: >-
    Começa pelo prazo em vez de "Sim"; incluído que o repasse dos recursos líquidos é feito pelo agente de
    custódia (Regulamento TD, item 156, v-x, p. 37-38).

- id: N2.3
  nivel: N2
  modulo: null
  pergunta: "Por quanto tempo antes da divulgação das demonstrações financeiras os administradores de uma companhia aberta ficam proibidos de negociar ações da empresa?"
  comportamento_esperado: responder
  referencia: >-
    Por 15 dias. Nos 15 dias que antecedem a divulgação das informações contábeis trimestrais e das
    demonstrações financeiras anuais, a companhia, os acionistas controladores, os diretores e os membros
    dos conselhos de administração e fiscal ficam impedidos de negociar valores mobiliários da companhia,
    mesmo que não conheçam o conteúdo dessas informações. O dia da divulgação não entra na contagem, e a
    negociação só pode ocorrer nesse dia depois da divulgação. A exceção são negociações feitas dentro de um
    plano individual de investimento ou desinvestimento formalizado previamente, nas condições da norma.
  fontes_referencia:
    - {documento: cvm_resolucao_44_2021, pagina: "p. 12-13"}
    - {documento: cvm_resolucao_44_2021, pagina: "p. 14"}
  conferido_autor: true
  validado: true
  revisao_previa: "Incluída a exceção dos planos de investimento/desinvestimento (Res. CVM 44, art. 16, § 2º, p. 14)."

- id: N2.4
  nivel: N2
  modulo: null
  pergunta: "Se uma informação relevante vazar antes de a empresa divulgar, o que a companhia é obrigada a fazer e em quanto tempo?"
  comportamento_esperado: responder
  referencia: >-
    A companhia pode, excepcionalmente, adiar a divulgação de um fato relevante quando isso proteger um
    interesse legítimo dela. Mas, se a informação escapar ao controle ou houver oscilação atípica na
    cotação, no preço ou na quantidade negociada das ações, os controladores ou administradores, diretamente
    ou por meio do Diretor de Relações com Investidores, são obrigados a divulgar o fato relevante
    imediatamente. A divulgação é feita à CVM e às bolsas em que as ações são negociadas, ao mesmo tempo; se
    precisar ocorrer durante o pregão, o Diretor de Relações com Investidores pode pedir a suspensão da
    negociação.
  fontes_referencia:
    - {documento: cvm_resolucao_44_2021, pagina: "p. 3"}
    - {documento: cvm_resolucao_44_2021, pagina: "p. 5"}
  conferido_autor: true
  validado: true
  revisao_previa: "Incluídas a divulgação simultânea à CVM e às bolsas e a suspensão da negociação (Res. CVM 44, art. 3º e 5º, p. 3 e 5)."
  nota_cobertura: >-
    O top-3 do chat traz o TOP Direito citando a Instrução CVM 358 (revogada pela Res. CVM 44). A regra é a
    mesma, mas a resposta pode citar norma desatualizada: conferir na análise.

- id: N2.5
  nivel: N2
  modulo: null
  pergunta: "Qual percentual mínimo de ações em circulação (free float) uma empresa do Novo Mercado precisa manter?"
  comportamento_esperado: responder
  referencia: >-
    A regra geral é manter pelo menos 20% do capital social em ações em circulação. O mínimo cai para 15% se
    o volume financeiro médio diário de negociação das ações for igual ou superior a R$ 20 milhões nos
    últimos 12 meses. Empresas que entram no Novo Mercado junto com uma oferta pública podem manter 15% nos
    primeiros 18 meses, se cumprirem as condições do regulamento.
  fontes_referencia:
    - {documento: b3_regulamento_novo_mercado, pagina: "p. 7"}
    - {documento: cvm_livro_top_mercado_valores_mobiliarios, pagina: "p. 279"}
  conferido_autor: true
  validado: true

- id: N3.1
  nivel: N3
  modulo: null
  pergunta: "Tenho R$ 400 mil para aplicar e quero ficar protegido pelo FGC. Como posso distribuir entre CDB, LCI e Tesouro Direto e o que fica fora da garantia?"
  comportamento_esperado: responder
  referencia: >-
    CDB e LCI são cobertos pelo FGC até R$ 250 mil por CPF por instituição ou conglomerado financeiro, com
    teto de R$ 1 milhão a cada quatro anos somando todas as instituições. CDB e LCI do mesmo banco (ou do
    mesmo conglomerado) somam no mesmo limite de R$ 250 mil. Para ficar protegido, o investidor não deve
    ultrapassar esse valor por instituição: por exemplo, R$ 150 mil em CDB num banco, R$ 150 mil em LCI num
    banco de outro conglomerado e R$ 100 mil no Tesouro Direto. Como o limite vale para o saldo com os
    rendimentos, e não só para o valor aplicado, convém deixar uma margem abaixo de R$ 250 mil; o que passar
    disso numa mesma instituição fica sem garantia. O Tesouro Direto não está entre os produtos cobertos pelo
    FGC, mas os títulos públicos federais são emitidos pelo Tesouro Nacional e considerados de risco de
    crédito muito baixo; por isso, a parte aplicada nele não depende do FGC. Na tributação, a LCI é isenta de
    imposto de renda para pessoa física, enquanto o CDB segue a tabela regressiva da renda fixa.
  fontes_referencia:
    - {documento: cmn_resolucao_4222_fgc, pagina: "p. 31-32"}
    - {documento: bcb_caderno_gestao_financas_pessoais, pagina: "p. 64-65"}
    - {documento: cvm_livro_top_planejamento_financeiro_pessoal, pagina: "p. 68"}
    - {documento: cvm_livro_top_planejamento_financeiro_pessoal, pagina: "p. 104"}
    - {documento: cmn_resolucao_4222_fgc, pagina: "p. 34"}
    - {documento: cvm_livro_top_planejamento_financeiro_pessoal, pagina: "p. 95"}
    - {documento: cvm_livro_top_planejamento_financeiro_pessoal, pagina: "p. 97"}
  conferido_autor: true
  validado: true
  ajustes: "16/11 (especialistas 1 e 2): Tesouro incluído no exemplo de distribuição; explicitado que CDB e LCI do mesmo banco ou conglomerado somam no mesmo limite (Res. 4.222, art. 2º, § 2º, p. 32); incluída a isenção de IR da LCI para pessoa física (TOP Planejamento, p. 97) e a tabela regressiva do CDB (p. 95). Não incluída a tributação do Tesouro: não conferida nos trechos do corpus."
  revisao_previa: >-
    Incluídos um exemplo numérico de distribuição e a margem por causa dos rendimentos (Res. 4.222, art. 2º,
    § 11, p. 34). Recusada a menção à carência da LCI (fora das páginas citadas).
  nota_cobertura: >-
    Nenhum trecho diz explicitamente "o FGC não cobre o Tesouro Direto". A referência deduz isso da lista de
    produtos cobertos. Peça ao especialista para confirmar a redação. É a mesma pergunta da tarefa T2.

- id: N3.2
  nivel: N3
  modulo: null
  pergunta: "Trabalho numa companhia aberta e soube de uma aquisição antes do anúncio oficial. Posso comprar ações dela? O que a regra diz e o que pode acontecer?"
  comportamento_esperado: responder
  referencia: >-
    Não. A Resolução CVM 44 proíbe qualquer pessoa que tenha acesso a informação relevante ainda não
    divulgada de usá-la para obter vantagem, para si ou para outra pessoa, negociando valores mobiliários
    (por isso, também não pode passar a informação para alguém negociar), e a Lei das S.A. obriga o
    administrador a guardar sigilo sobre essas informações. Uma aquisição ainda não anunciada é uma
    informação capaz de influenciar a cotação. Além das sanções administrativas da CVM, usar a informação
    é crime (uso indevido de informação privilegiada, art. 27-D da Lei 6.385/76), com pena de reclusão de
    1 a 5 anos e multa de até três vezes a vantagem obtida.
  fontes_referencia:
    - {documento: cvm_resolucao_44_2021, pagina: "p. 11"}
    - {documento: cvm_livro_top_direito_mercado_valores_mobiliarios, pagina: "p. 241"}
    - {documento: cvm_livro_top_direito_mercado_valores_mobiliarios, pagina: "p. 253"}
  conferido_autor: true
  validado: true
  revisao_previa: "Incluída a vantagem 'para si ou para outrem' do art. 13 da Res. CVM 44 (p. 11): vale também para repassar a informação."
  nota_cobertura: >-
    O top-3 do chat traz um trecho sobre OPA/aquisição hostil (pouco útil), o art. 155 da Lei das S.A. e um
    trecho sobre OPA parcial. O art. 13 da Res. 44 e o art. 27-D não aparecem no top-5.

- id: N3.3
  nivel: N3
  modulo: null
  pergunta: "Quero começar com pouco dinheiro na bolsa. Que diferença faz, em proteção ao acionista minoritário, comprar ações de uma empresa do Novo Mercado em vez de uma empresa de outro segmento?"
  comportamento_esperado: responder
  referencia: >-
    O Novo Mercado é o segmento com mais exigências de governança. Nele, o capital só pode ter ações
    ordinárias, com direito a voto; na venda do controle, todos os acionistas podem vender pelo mesmo preço
    pago ao controlador (tag along de 100%); a empresa mantém ao menos 20% das ações em circulação (ou 15%,
    com alto volume de negociação); o conselho tem pelo menos 2 ou 20% de conselheiros independentes; e, se
    a empresa sair do segmento, precisa fazer oferta pública de aquisição por valor justo. Em outros
    segmentos as exigências são menores: o Nível 2, por exemplo, permite ações preferenciais. Fora dos
    segmentos especiais vale só a Lei das S.A., que garante aos minoritários com ações ordinárias (com voto)
    pelo menos 80% do preço pago ao controlador na venda do controle.
  fontes_referencia:
    - {documento: cvm_livro_top_mercado_valores_mobiliarios, pagina: "p. 275-276"}
    - {documento: cvm_livro_top_mercado_valores_mobiliarios, pagina: "p. 277-278"}
    - {documento: cvm_livro_top_mercado_valores_mobiliarios, pagina: "p. 250-251"}
  conferido_autor: true
  validado: true
  revisao_previa: "Incluído o tag along legal de 80% para ações com voto (TOP Mercado, p. 250-251)."

- id: N3.4
  nivel: N3
  modulo: null
  pergunta: "Estou em dúvida entre um fundo imobiliário e comprar um imóvel para alugar. O que muda em liquidez, diversificação e custos, segundo o material da CVM?"
  comportamento_esperado: responder
  referencia: >-
    O fundo imobiliário permite investir em imóveis com pequenas quantias, diversificar entre vários
    empreendimentos e diluir os custos de administração entre todos os cotistas. Nos custos, o cotista não
    cuida de certidões, escritura, ITBI, manutenção e reparos, que são providenciados pelo administrador e
    pagos com recursos do próprio fundo, ou seja, indiretamente pelos cotistas; no imóvel direto, tudo isso é
    do proprietário. A vacância (imóvel sem inquilino) é um risco nos dois casos. Na liquidez, é possível
    vender só parte das cotas no mercado secundário, enquanto no imóvel direto seria preciso vender o bem
    inteiro; em compensação, a venda das cotas depende de haver compradores nesse mercado. Os rendimentos
    distribuídos podem ser isentos de imposto de renda, se o fundo cumprir as condições legais.
  fontes_referencia:
    - {documento: cvm_caderno_06_fundos_imobiliarios, pagina: "p. 7-9"}
    - {documento: cvm_caderno_06_fundos_imobiliarios, pagina: "p. 11"}
    - {documento: cvm_livro_top_planejamento_financeiro_pessoal, pagina: "p. 149"}
    - {documento: cvm_livro_top_planejamento_financeiro_pessoal, pagina: "p. 151-152"}
  conferido_autor: true
  validado: true
  ajustes: "16/11 (especialista 1, Correta = Ajustar): CORRIGIDO. Os custos não \"ficam com o administrador\": ele os providencia, mas paga com recursos do fundo, isto é, dos cotistas (Caderno CVM 6, p. 8). Recusada a comparação tributária (20% sobre o ganho das cotas via DARF × carnê-leão): não consta no corpus e a pergunta trata de liquidez, diversificação e custos."
  revisao_previa: >-
    Incluídos os custos do imóvel direto (certidões, escritura, ITBI, manutenção) e o risco de vacância
    (Caderno CVM 6, p. 8 e 11). Recusada a tributação do ganho na venda de cotas (não conferida no corpus).

- id: N3.5
  nivel: N3
  modulo: null
  pergunta: "Quero investir numa empresa e ver se ela é confiável. Que documento obrigatório devo consultar, onde encontro e que informações ele traz?"
  comportamento_esperado: responder
  referencia: >-
    O principal documento é o Formulário de Referência, instituído em 2009 e hoje regido pela Resolução CVM
    80/2022, que obriga a companhia aberta a enviá-lo à CVM atualizado todo ano, em até 5 meses após o fim do
    exercício. Ele traz as atividades da empresa, fatores de risco, estrutura de capital, dados financeiros,
    comentários da administração, principais acionistas, composição dos conselhos e remuneração dos
    administradores. Ele pode ser consultado no site da CVM, junto com demonstrações financeiras e fatos
    relevantes, e no site de Relações com Investidores da empresa. Também vale consultar as demonstrações
    financeiras anuais (DFP) e as informações trimestrais (ITR): as anuais vêm acompanhadas do relatório do
    auditor independente, e as trimestrais passam por revisão especial de auditor independente registrado na
    CVM; eventuais ressalvas e ênfases do auditor ajudam a avaliar a confiabilidade das informações. O
    documento ajuda a avaliar a empresa, mas não garante que ela seja um bom investimento.
  fontes_referencia:
    - {documento: cvm_caderno_01_o_que_e_a_cvm, pagina: "p. 22-23"}
    - {documento: cvm_resolucao_80_2022, pagina: "p. 9"}
    - {documento: cvm_resolucao_80_2022, pagina: "p. 7"}
